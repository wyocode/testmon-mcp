          source: |-
            <?php

            $url = 'https://<mydomain>.testmonitor.com/api/v1';
            $collection = 'issues';

            $data = [
                'project_id' => 42,
                'name' => 'Lorem ipsum',
                'description' => 'Lorem ipsum',
                'issue_category_id' => 1,
                'issue_status_id' => 1,
                'issue_priority_id' => 2,
            ];

            $curl = curl_init($url . '/' . $collection);

            curl_setopt($curl, CURLOPT_RETURNTRANSFER, true);
            curl_setopt($curl, CURLOPT_CUSTOMREQUEST, 'POST');
            curl_setopt($curl, CURLOPT_POSTFIELDS,  json_encode($data));
            curl_setopt($curl, CURLOPT_HTTPHEADER, [
                'Authorization: Bearer <token>',
                'Content-Type: application/json',
                'Accept: application/json',
            ]);

            $response = curl_exec($curl);

            curl_close($curl);
    get:
      tags:
        - Issue Basics
      summary: Get all issues
      operationId: GetIssueCollection
      security:
        - BearerAuth: []
      description: |
        Retrieve all issues from a project.

        Apply custom filters, sorting, and pagination to find the issues you need.
        Include related data using the relations parameter.
      parameters:
        - name: project_id
