  description: |-
    The TestMonitor REST API allows you to access and automate TestMonitor’s data model, enabling custom integrations, reporting, and workflow automation. The API is primarily intended to help teams integrate TestMonitor into their existing toolchain and automate quality management workflows, including CI/CD pipelines and test automation frameworks.

    Common use cases include:
    - Creating and updating **test runs** and **test results**
    - Integrating **automated test results** from CI/CD pipelines
    - Building **custom integrations** and **reporting solutions**

    The API is RESTful and HTTP-based, uses predictable resource URLs, standard HTTP status codes, and JSON request and response bodies. Any standard HTTP or REST client can be used.

    For submitting automated test results or integrating with CI/CD pipelines, consider using our official [test automation packages](https://www.npmjs.com/search?q=keywords%3Atestmonitor) or [CLI tool](https://www.npmjs.com/package/@testmonitor/testmonitor-cli). These tools are built on top of the API and offer a simpler, higher-level integration for most automation scenarios.

    > [!note]
    > The TestMonitor API is actively evolving. We aim to keep changes backward-compatible where possible. When changes are required, we follow a deprecation process and document updates in our changelog, allowing integrations to adapt in a predictable way.

    If you have questions or need assistance, please contact our support team at [support@testmonitor.com](mailto:support@testmonitor.com).
servers:
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: example.testmonitor.com
        description: Specify your TestMonitor domain here.
security:
  - BearerAuth: []
tags:
  - name: Authentication
    description: "The TestMonitor API uses Personal Access Tokens to authenticate requests.\n\n## Generate a Personal Access Token\nWhen you have access to a TestMonitor environment, you can generate one or more Personal Access Tokens from your account settings:\n\n1.\tOpen the profile menu (top-right) and go to **My Account**.\n2.\tScroll to the **API** section.\n3.\tClick **Create token**.\n4.\tEnter a label/name (so you know where it’s used).\n5.\tClick **Create**.\n6.\tCopy and store the token.\n\nTokens are only shown once when they are created, so make sure to store them securely.\n\n## Using a Personal Access Token\n\nAuthentication is performed by including the token in the Authorization request header using the Bearer scheme:\n\n```\nAuthorization: Bearer <your_token>\n```\n\nAll API requests must be made over HTTPS. Requests without a valid token will be rejected.\n\n> [!note]\n> Personal Access Tokens can be revoked at any time. If a token is compromised or no longer needed, revoke it and create a new one.\n"
  - name: Pagination
    description: |
      When an endpoint can return many records, responses are paginated to improve performance and manageability. The TestMonitor API uses limit and page parameters to control pagination.

      ## Limit

      Use the `limit` parameter to control how many records are returned per page. For example, to request 25 test cases at a time:

      ```url
      /api/v1/test-cases?project_id=1&limit=25
      ```

      - Default limit is **15**
      - Minimum is **5**
      - Maximum is **100**

      ## Page

      Use the `page` parameter to request a specific page of results. Page numbers start at 1:

      ```url
      /api/v1/test-cases?project_id=1&limit=25&page=2
      ```

      - Default page is **1**

      ## Meta and totals

      Every paginated response includes a `meta` object with information about the current page, total records, and pagination details:

      ```json
      {
        "data": [...],
        "links": {...},
        "meta": {
          "current_page": 1,
          "from": 1,
          "last_page": 2,
          "path": "https://mydomain.testmonitor.com/api/v1/test-cases",
          "per_page": 15,
          "to": 15,
          "total": 25
        }
      }
      ```

      ## Links

      Paginated responses also include a `links` object with navigation URLs for easy traversal:

      ```json
      {
        "data": [...],
        "links": {
          "first": "https://mydomain.testmonitor.com/api/v1/test-cases?page=1",
          "last": "https://mydomain.testmonitor.com/api/v1/test-cases?page=2",
          "next": "https://mydomain.testmonitor.com/api/v1/test-cases?page=2",
          "prev": null
        },
        "meta": {...}
      }
      ```

      When `next` is null, you've reached the last page. When `prev` is null, you're on the first page.
  - name: Filters & Search
    description: |-
      The TestMonitor API provides two ways to narrow down your results: **filters** for selecting specific subsets of records based on exact criteria, and **search** for fuzzy text-based queries.

      ## Filtering

      Use the `filter[]` parameter to retrieve records that match specific criteria. For example, to retrieve test cases marked as draft:

      ```url
      /api/v1/test-cases?project_id=1&filter[draft]=1
      ```

      The available filters vary by endpoint and are documented in each endpoint's reference documentation.

      ### Multiple criteria

      You can combine multiple filters in a single request. Filters are applied using AND logic, meaning all conditions must be met:

      ```url
      /api/v1/test-cases?project_id=1&filter[draft]=1&filter[test_case_folder_id]=4&filter[requirements]=[1,2]
      ```

      This returns test cases that are:

      - **Draft**
      - In folder with ID **4**
      - Related to requirements ID **1** and **2**

      ### Custom fields

      You can filter on Select and Multiselect custom fields using a nested structure:

      ```url
      /api/v1/issues?project_id=1&filter[custom_fields][browser]=4
      ```

      This filters issues where the custom field with key `browser` has the option ID `4`.

      ## Searching

      Use the `query` parameter for fuzzy text search across multiple fields. For example, to search test cases for "customer":

      ```url
      /api/v1/test-cases?project_id=1&query=customer
      ```

      Search for multiple words to find word combinations:

      ```url
      /api/v1/test-cases?project_id=1&query=login flow
      ```

      Use quoted words for exact match searches:

      ```url
      /api/v1/test-cases?project_id=1&query="user authentication"
      ```

      Search can match related fields such as status or category, depending on the endpoint.

      > [!note]
      > When custom fields are present, search may also include text-based custom field types such as text, rich text, and number fields.
  - name: Sorting
    description: |
      To sort results, add the `order` parameter to your request with the field name you want to sort by. For example, to sort test cases ascending by name:

      ```url
      /api/v1/test-cases?project_id=1&order=name
      ```

      To sort descending, prefix the field name with a hyphen (-):

      ```url
      /api/v1/test-cases?project_id=1&order=-name
      ```

      You can only sort by one field at a time.

      The available sortable fields vary by endpoint and are documented in each endpoint's reference documentation.

      > [!note]
      > Prefix the field name with a hyphen (-) to sort in descending order.
  - name: Relations
    description: |
      The TestMonitor API allows you to include related objects in your responses using the `with[]` query parameter. For performance reasons, relations are **not included by default** and must be explicitly requested.

      To include a single relation, add the `with[]` parameter with the relation name. For example, to include requirements for test cases:

      ```url
      /api/v1/test-cases?project_id=1&with[]=requirements
      ```

      You can include multiple relations by adding multiple `with[]` parameters:

      ```url
      /api/v1/test-cases?project_id=1&with[]=requirements&with[]=risks&with[]=created_by
      ```

      Related objects are returned as shallow representations, not full objects.

      The available relations vary by endpoint and are documented in each endpoint's reference documentation.

      > [!note]
      > Custom fields are also a relation and must be explicitly included using `with[]=custom_fields`
  - name: Responses
    description: |-
      The TestMonitor API uses **standard HTTP response codes** to indicate whether a request was successful or failed.

      - **2xx** responses indicate **success**
      - **4xx** responses indicate a **client-side error** (invalid input, missing parameters, authentication or permission issues)
      - **5xx** responses indicate a **server-side error**

      The following table lists the most common HTTP status codes returned by the TestMonitor API:

      |   HTTP status code  |   Type                |   Description                                           |
      |---------------------|-----------------------|---------------------------------------------------------|
      |   401               |   Unauthorized        |   Invalid or missing authentication token               |
      |   403               |   Forbidden           |   Insufficient permissions for the requested action     |
      |   404               |   Not found           |   The requested resource does not exist or was deleted  |
      |   405               |   Method not allowed  |   The HTTP method is not supported for this endpoint    |
      |   422               |   Validation error    |   One or more request parameters are invalid            |
      |   429               |   Too many requests   |   Rate limit exceeded                                   |
      |   5xx               |   Server error        |   An error occurred on the TestMonitor servers          |

      > [!tip]
      > When troubleshooting errors, inspect both the HTTP status code and the response body. Validation errors (422) often include detailed field-level messages that help identify the exact issue.
  - name: Rate Limiting
    description: |-
      To ensure fair use and platform stability, the TestMonitor API enforces rate limits.

      Rate limiting applies to each access token and includes both API requests and actions performed via the TestMonitor user interface.

      - The rate limit window duration is **60 seconds**
      - The maximum number of requests is **1000 per 60-second window**

      Each API request will include the following rate limit response headers:

      | Header                | Value | Description                                                                           |
      |-----------------------|-------|---------------------------------------------------------------------------------------|
      | X-RateLimit-Limit     | 1000  | The maximum number of requests current access_token can perform per 60-second window. |
      | X-RateLimit-Remaining | 987   | The number of requests left for the 60-second window.                                 |

      If you exceed the rate limit, additional requests will be rejected with an HTTP 429 – Too Many Requests response.
      Once the current rate limit window resets, requests will be accepted again automatically.

      > [!tip]
      > For high-volume integrations or automation, consider batching requests and avoiding unnecessary polling to stay within the rate limits.
  - name: Changelog
    description: |
      Our API is under development. Sometimes we need to change our endpoints or we have minor fixes in the documentation itself. For a complete changelog of TestMonitor visit <a href="https://changelog.testmonitor.com/">https://changelog.testmonitor.com</a>.

      **February the 15th, 2026**
      - Added
          - The `status` relation is added to risk, requirement, application, test case and test run.
      - Updated
          - The `tags` relation must be included in the request when needed for risk, requirement, test case and test run.
      - Deprecated
          - The `outcome` relation is deprecated. Use the new `status` relation instead.

      **December the 15th, 2025**
      - Added
          - Clone test runs to another milestone.
          - Move test runs to another milestone.

      **September the 25th, 2025**
      - Added
          - Test types for test cases, test runs and test results.
          - Draft parameter defaults to true when creating test results and is no longer required.

      **February the 12th, 2025**
      - Added
          - Milestone relation on test result.

      **December the 17th, 2024**
      - Added
          - Dedicated endpoints for marking test results as viewed / not viewed.
          - Improved validation requiring currently authenticated user to be assign to specified test run.
      - Removed
          - `viewed` attribute when updating a test result. Use the `mark-as-viewed` and `mark-as-not-viewed` endpoints instead.

      **November the 30th, 2024**
      - Added
          - Test case folders.
      - Updated
          - Filters: all attributes now consistently use snake_case as a naming convention. Refer to the upgrade guide for more information.
          - Relations: all attributes now consistently use snake_case as a naming convention. Refer to the upgrade guide for more information.
          - Sorting: the object-based specification (order: [{'name': 'asc'}], order: [{'code': 'desc'}]) has been replaced by a more simple string-based approach (order: 'name', order: '-code'). The minus character (-) is used to denote a descending order. Refer to the upgrade guide for more information.
      - Deprecated
          - Test suite identifier (`test_suite_id`) has been deprecated in favor of the folder identifier (`test_case_folder_id`). This affects creating and updating test cases. We recommend updating your code to use `test_case_folder_id`.
          - Test suite get and list endpoints has been deprecated in favor of folders. Update your code to use the new folders endpoints.
      - Removed
          - Test result category (`test_result_category_id`). Update your code to use `test_result_status_id`.
          - Test suite create, update, delete and restore endpoint. Update your code to use the folders endpoints instead.

      **April the 13th, 2024**
      - Removed
          - issue-tasks endpoint

      **October the 11th, 2023**
      - Added
          - Test run state object in test runs.
      - Updated
          - Test run start- and end dates are now datetime objects (`starts_at` and `ends_at`).
          - Test run start- and end dates have become optional.
          - Milestone end date has become optional.
      - Deprecated
          - Test result category (`test_result_category_id`) has been deprecated in favor of test results status (`test_result_status_id`). This affects creating and updating test results. Update your code to use `test_result_status_id`.

      **July the 4th, 2023**
      - Added
          - Webhooks endpoints.
      - Removed
          - Invalid show endpoints for test case, test run and issue attachment.

      **May the 2nd, 2023**
      - Added
          - Warning messages indicating subscription plan-based restrictions.
      - Updated
          - Fixed broken knowledge base links.

      **February the 7th, 2023**
      - Updated
          - Projects endpoint: made Symbol ID required.
  - name: Applications
    description: |
      Create, list, update, and delete applications in TestMonitor.

      Applications represent the software products or systems under test. Test cases can be
      assigned to applications to track which parts of your software are being tested.

      Find out more about applications in our [knowledge base](https://help.testmonitor.com/manage-your-applications).
  - name: Versions
    description: |
      List application versions in TestMonitor.

      Versions represent specific releases of an application, identified by a version number
      and release date.

      Find out more about applications in our [knowledge base](https://help.testmonitor.com/manage-your-applications).
  - name: Issue Basics
    description: |
      Create, list, update, and delete issues in TestMonitor.

      Issues track bugs, defects, and other problems found during testing or development.

      Find out more about issues in our [knowledge base](https://help.testmonitor.com/how-to-use-issue-management).
    x-displayName: Basics
  - name: Issue Batch
    description: |
      Update or delete multiple issues in a single request.

      Find out more about issues in our [knowledge base](https://help.testmonitor.com/how-to-use-issue-management).
    x-displayName: Batch
  - name: Issue Attachments
    description: |
      Upload, list, and delete file attachments for issues.

      Find out more about issues in our [knowledge base](https://help.testmonitor.com/how-to-use-issue-management).
    x-displayName: Attachments
  - name: Issue Comments
    description: |
      List and post comments on issues to collaborate with your team.

      Find out more about issues in our [knowledge base](https://help.testmonitor.com/how-to-use-issue-management).
    x-displayName: Comments
  - name: Issue Tasks
    description: |
      Create, list, update, and delete tasks for issues. Tasks break down an issue into
      smaller, actionable items.

      Find out more about issues in our [knowledge base](https://help.testmonitor.com/how-to-use-issue-management).
    x-displayName: Tasks
  - name: Issue More
    description: |
      Manage tags and link test results to issues.

      Find out more about issues in our [knowledge base](https://help.testmonitor.com/how-to-use-issue-management).
    x-displayName: More
  - name: My Issues
    description: |
      A list of issues assigned to the authenticated user.
  - name: My Issue Tasks
    description: |
      A list of tasks assigned to the authenticated user.
  - name: Risk Basics
    description: |
      Create, list, update, and delete risks in TestMonitor.

      Risks represent potential problems, threats, or uncertainties that could negatively
      impact your project or product if not addressed. Test cases can be assigned to risks
      to establish traceability between your risks and test coverage.

      Find out more about risks in our [knowledge base](https://help.testmonitor.com/how-to-use-risks).
    x-displayName: Basics
  - name: Risk Batch
    x-displayName: Batch
    description: |
      Update or delete multiple risks in a single request.

      Find out more about risks in our [knowledge base](https://help.testmonitor.com/how-to-use-risks).
  - name: Risk More
    x-displayName: More
    description: |
      Manage tags for risks.

      Find out more about risks in our [knowledge base](https://help.testmonitor.com/how-to-use-risks).
  - name: Requirement Basics
    description: |
      Create, list, update, and delete requirements in TestMonitor.

      Requirements define the features, functionalities, or conditions that your software
      must satisfy. Test cases can be assigned to requirements to establish traceability
      between your requirements and test coverage.

      Find out more about requirements in our [knowledge base](https://help.testmonitor.com/how-to-use-requirements).
    x-displayName: Basics
  - name: Requirement Batch
    x-displayName: Batch
    description: |
      Update or delete multiple requirements in a single request.

      Find out more about requirements in our [knowledge base](https://help.testmonitor.com/how-to-use-requirements).
  - name: Requirement More
    x-displayName: More
    description: |
      Manage tags for requirements.

      Find out more about requirements in our [knowledge base](https://help.testmonitor.com/how-to-use-requirements).
  - name: Test Case Basics
    description: |
      Create, list, update, and delete test cases in TestMonitor.

      Test cases define the steps and expected results for testing your application. Once
      created, test cases can be organized in folders, assigned to requirements, risks, and
      applications, and included in test runs.

      Find out more about test cases in our [knowledge base](https://help.testmonitor.com/how-to-use-test-cases).
    x-displayName: Basics
  - name: Test Case Batch
    description: |
      Update or delete multiple test cases in a single request.

      Find out more about test cases in our [knowledge base](https://help.testmonitor.com/how-to-use-test-cases).
    x-displayName: Batch
  - name: Test Case Folders
    description: |
      Organize test cases into a hierarchical folder structure.

      Find out more about test cases in our [knowledge base](https://help.testmonitor.com/how-to-use-test-cases).
    x-displayName: Folders
  - name: Test Case Attachments
    description: |
      Upload, list, and delete file attachments for test cases.

      Find out more about test cases in our [knowledge base](https://help.testmonitor.com/how-to-use-test-cases).
    x-displayName: Attachments
  - name: Test Case Suites
    description: |
      List test suites in TestMonitor.

      > [!warning]
      > These endpoints are deprecated and will be removed in a future release.
    x-displayName: Suites
  - name: Test Case More
    description: |
      Manage tags and view linked resources for test cases.

      Find out more about test cases in our [knowledge base](https://help.testmonitor.com/how-to-use-test-cases).
    x-displayName: More
  - name: Test Result Basics
    description: |
      Create, list, update, and delete test results in TestMonitor.

      Test results record the outcome of executing a test case within a test run, including
      the status, any notes, and the user who performed the test.

      Find out more about test results in our [knowledge base](https://help.testmonitor.com/track-your-results-by-test-run).
    x-displayName: Basics
  - name: Test Result Attachments
    description: |
      Upload, list, and delete file attachments for test results.

      Find out more about test results in our [knowledge base](https://help.testmonitor.com/track-your-results-by-test-run).
    x-displayName: Attachments
  - name: Test Result Comments
    description: |
      List and post comments on test results to collaborate with your team.

      Find out more about test results in our [knowledge base](https://help.testmonitor.com/track-your-results-by-test-run).
    x-displayName: Comments
  - name: Test Result More
    description: |
      Mark test results as viewed or not viewed, and link issues to test results.

      Find out more about test results in our [knowledge base](https://help.testmonitor.com/track-your-results-by-test-run).
    x-displayName: More
  - name: Test Run Basics
    description: |
      Create, list, update, and delete test runs in TestMonitor.

      Test runs are organized testing sessions where you execute test cases to verify
      software functionality. Once created, test runs can be run by assigned users, have
      test results recorded, and be included in reports and metrics.

      Find out more about test runs in our [knowledge base](https://help.testmonitor.com/how-to-use-test-runs).
    x-displayName: Basics
  - name: Test Run Batch
    description: |
      Update or delete multiple test runs in a single request.

      Find out more about test runs in our [knowledge base](https://help.testmonitor.com/how-to-use-test-runs).
    x-displayName: Batch
  - name: Test Run More
    description: |
      Manage tags, view states, and access linked resources for test runs.

      Find out more about test runs in our [knowledge base](https://help.testmonitor.com/how-to-use-test-runs).
    x-displayName: More
  - name: My Test Runs
    description: |
      A list of test runs assigned to the authenticated user.
  - name: Environments
    description: |
      Create, list, update, and delete environments in TestMonitor.

      Test environments represent the platforms or configurations used to execute test runs,
      such as browsers, operating systems, or devices.

      Find out more about environments in our [knowledge base](https://help.testmonitor.com/manage-your-test-environments).
  - name: Milestone Basics
    description: |
      Create, list, update, and delete milestones in TestMonitor.

      Milestones represent key points in your project timeline, such as releases or sprints,
      and can be used to organize test runs.

      Find out more about milestones in our [knowledge base](https://help.testmonitor.com/how-to-use-milestones).
    x-displayName: Basics
  - name: Milestone Batch
    description: |
      Delete multiple milestones in a single request.

      Find out more about milestones in our [knowledge base](https://help.testmonitor.com/how-to-use-milestones).
    x-displayName: Batch
  - name: Projects
    description: |
      Create, list, update, and archive projects in TestMonitor.

      Projects are the top-level containers for organizing your test cases, requirements,
      risks, milestones, and other resources.

      Find out more about projects in our [knowledge base](https://help.testmonitor.com/project-management).
  - name: My Projects
    description: |
      A list of projects accessible to the authenticated user.
  - name: Users
    description: |
      Create, list, update, delete, and archive users in TestMonitor.

      Users can be assigned to projects, test runs, and teams to collaborate on testing
      activities.

      Find out more about users in our [knowledge base](https://help.testmonitor.com/users-and-teams).
  - name: Teams
    description: |
      Create, list, update, and delete teams in TestMonitor.

      Teams allow you to group users together, providing an additional way to organize and
      filter users across your account.

      Find out more about teams in our [knowledge base](https://help.testmonitor.com/users-and-teams).
  - name: Custom Fields
    description: |
      List custom fields in TestMonitor.

      Custom fields allow you to extend resources with additional data tailored to your workflow.

      > [!note]
      > These endpoints are available when subscribed to either a **Professional** or **Enterprise** plan.
  - name: Webhooks
    description: |
      Create, list, update, and delete webhooks in TestMonitor.

      Webhooks send HTTP notifications to a specified URL when certain events occur, such as
      the creation or update of test cases, requirements, or other resources.

      Find out more about webhooks in our [knowledge base](https://help.testmonitor.com/webhooks).
  - name: Symbols
    description: |
      List all symbols in TestMonitor.

      Symbols are icons that can be used as visual identifiers throughout TestMonitor.
paths:
  /applications:
    post:
      tags:
        - Applications
      summary: Create an application
      operationId: PostApplication
      security:
        - BearerAuth: []
      description: |
        Create a new application.
      requestBody:
        content: &ref_147
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  description: The name of the application.
                  allOf:
                    - type: string
                      description: A resource string.
                      maxLength: 100
                      example: Lorem ipsum dolor sit amet, consectetur adipiscing elit
                description:
                  description: The description of the application.
                  allOf:
                    - type: string
                      description: A resource text string.
                      maxLength: 10000
                      example: Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vestibulum in ex in nisi dapibus finibus. Class aptent taciti sociosqu ad litora torquent per conubia nostra, per inceptos himenaeos.
      responses:
        '201':
          description: Application was created
          headers:
            X-RateLimit-Limit:
              description: The number of allowed requests in the current period
              schema: &ref_0
                type: integer
            X-RateLimit-Remaining:
              description: The number of remaining requests in the current period
              schema: &ref_1
                type: integer
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: object
                        title: Application
                        properties: &ref_2
                          id:
                            description: The application identifier.
                            readOnly: true
                            allOf:
                              - type: integer
                                description: The resource identifier. Defaults to integer.
                                example: 42
                          name:
                            type: string
                            description: The name of the application.
                            example: Lorem Ipsum
                          description:
                            description: The description of the application.
                            allOf:
                              - type: string
                                description: A resource string.
                                maxLength: 100
                                example: Lorem ipsum dolor sit amet, consectetur adipiscing elit
                          test_cases:
                            type: array
                            description: The test cases linked to this application.
                          test_cases_count:
                            type: integer
                            description: The amount of test cases linked to the application.
                            example: 15
                          versions:
                            type: array
                            description: The versions of an application.
                          versions_count:
                            type: integer
                            description: The number of versions of an application.
                            example: 6
                          endpoints:
                            allOf:
                              - type: object
                                description: All available API endpoints for this record.
                          links:
                            allOf:
                              - type: object
                                description: All available application url's for this record.
                          created_at:
                            description: Application create timestamp.
                            allOf:
                              - type: string
                                description: Read-only timestamp, automatically assigned on back-end.
                                format: date-time
                                readOnly: true
                          updated_at:
                            description: Application update timestamp.
